apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: grafana-alerts
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Dilsh4n/cloudops-sentinel-gitops.git
    targetRevision: HEAD
    path: monitoring/grafana-alerts

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true