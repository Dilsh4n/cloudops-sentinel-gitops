
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.47.2

    helm:
      releaseName: prometheus

      valuesObject:
        alertmanager:
          enabled: false

        prometheus-pushgateway:
          enabled: false

        kube-state-metrics:
          enabled: false

        prometheus-node-exporter:
          enabled: true

        server:
          global:
            scrape_interval: 30s

          retention: "24h"
          retentionSize: "1GB"

          persistentVolume:
            enabled: true
            size: 2Gi

          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 600m
              memory: 768Mi

          service:
            type: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
