apiVersion: v1
kind: Service
metadata:
  name: sentinal-api
  namespace: cloudops

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"

spec:
  type: ClusterIP
  selector:
    app: sentinal-api

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000