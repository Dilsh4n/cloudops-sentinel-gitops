apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinal-api
  namespace: cloudops
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 3
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: sentinal-api
  template:
    metadata:
      labels:
        app: sentinal-api
    spec:
      containers:
      - name: sentinel-api
        image: ghcr.io/dilsh4n/cloudops-sentinel@sha256:5d582d2f70a2a4165144eb6c36304d111fe99d6632a68623246c44a90c70f023
        imagePullPolicy: Always
        ports:
        - containerPort: 8000

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "384Mi"
        
        readinessProbe: 
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3